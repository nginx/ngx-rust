[package]
name = "nginx-src"
# Version format: <NGINX major>.<NGINX minor>.<crate patch>+<NGINX version>
version = "1.28.5+1.28.3"
# Crate sources are licensed under Apache-2.0, with exception of the
# NGINX submodule that is redistributed under BSD-2-Clause.
license = "Apache-2.0 AND BSD-2-Clause"
description = "Source of NGINX"
keywords = ["nginx", "module", "sys"]
exclude = [
    "/nginx/.git*",
    "/nginx/contrib",
    "/nginx/docs",
    "/nginx/misc",
    "!/nginx/docs/html",
    "!/nginx/docs/man",
]
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
duct = "1"
flate2 = "1.0.32"
tar = "0.4.45"
ureq = "3.2"

[lints]
workspace = true
