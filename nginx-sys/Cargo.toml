[package]
name = "nginx-sys"
version = "0.5.0"
categories = ["external-ffi-bindings"]
description = "FFI bindings to NGINX"
keywords = ["nginx", "ffi", "sys"]
build = "build/main.rs"
# This field is required to export DEP_NGINX_ vars
# See https://github.com/rust-lang/cargo/issues/3544
links = "nginx"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []

[dependencies]
cfg-if = "1.0.5"
errno = { version = "0.3.10", default-features = false }
libc.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
features = ["Win32", "Win32_Storage_FileSystem", "Win32_System_Console"]
version = ">=0.59,<0.62"

[build-dependencies]
bindgen = "0.73.2"
cc = "1.2.0"
dunce = "1.0.5"
regex = "1.11.1"
nginx-src = { version = "~1.30.0", optional = true, path = "../nginx-src" }
shlex = "2"

[features]
default = ["http"]
# Allows generation of bindings for the HTTP module.
http = []
# Allows generation of bindings for the Mail module.
mail = []
# Allows generation of bindings for the Stream module.
stream = []
# Enables downloading and building a copy of NGINX in the build script.
vendored = ["dep:nginx-src"]

[lints]
workspace = true
